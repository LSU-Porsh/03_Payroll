<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Payroll System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Simple Payroll System</h1>
    <form id="payrollForm">
      <label for="employeeName">Employee Name:</label>
      <input type="text" id="employeeName" name="employeeName" />

      <label for="hoursWorked">Hours Worked:</label>
      <input type="number" id="hoursWorked" name="hoursWorked" />

      <label for="ratePerHour">Rate per Hour:</label>
      <input type="number" id="ratePerHour" name="ratePerHour" />

      <button type="button" id="calculateBtn">Calculate Pay</button>
    </form>

    <div id="error" style="color: red; margin-top: 10px; font-weight: bold;"></div>
    <div id="result"></div>

    <script src="script.js"></script>
  </body>
</html>
